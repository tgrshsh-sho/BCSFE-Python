# jp fork: creating game data from the official app (core/server/game_data_builder.py)
gdb_build_offer=
><@w>Game data for this game version (<@s>{version}</>) is not available yet.</> It can be created from the official app (about 180 MB download).
>Create it now? ({{y/n}}):

# (the blank line above is needed: the parser drops a key right after a multi-line block)
gdb_build_declined=<@w>Skipped creating the game data. Newer cats and items may show as bare IDs.</>
gdb_build_start=<@q>Creating game data <@s>{version}</> from the official app...</>
gdb_build_done=<@su>Created game data <@s>{version}</>: <@t>{path}</></>
gdb_build_failed=<@e>Could not create the game data: {reason}</>

gdb_status_index=<@q>Getting the list of app versions...</>
gdb_status_package_file=<@q>Using the package file <@s>{path}</></>
gdb_status_download_start=<@q>Downloading the app package <@s>{version}</> (<@s>{size}</> MB)...</>
gdb_status_download=  <@s>{done}</> / <@s>{total}</> MB
gdb_status_extract=<@q>Decrypting the game files...</>
gdb_status_extracted=  <@t>{pack}</>: <@s>{files}</> files

gdb_reason_network=the download server could not be reached ({error})
gdb_reason_http=the download server answered HTTP {status}
gdb_reason_index=the list of app versions could not be read
gdb_reason_version_unavailable=version {version} is not offered for download (newest: {newest})
gdb_reason_sha256=the downloaded package is damaged (sha256 {got}, expected {expected})
gdb_reason_package=the file is not a readable app package ({error})
gdb_reason_wrong_package=the package is {found}, not The Battle Cats (jp)
gdb_reason_version_mismatch=the package is version {found}, not {version}
gdb_reason_packs_missing=the package does not contain {packs}
gdb_reason_bad_list=the file list {pack}.list is invalid ({error})
gdb_reason_bad_entry=a file in {pack}.pack could not be decrypted ({name})
gdb_reason_bad_name=stopped because {pack}.list contains a suspicious file name ({name})
gdb_reason_write=could not write to {path} ({error})
gdb_reason_exists=game data for {version} already exists
gdb_reason_unsupported=only jp game data can be created from the app (region: {cc})
gdb_reason_bad_version=invalid game version: {version}
gdb_reason_missing_file=the package file {path} does not exist
gdb_reason_unexpected=unexpected error ({error})

gdb_build_from_app=Create game data from the official app
gdb_available_versions=Available versions (newest first): <@t>{versions}</>
gdb_version_q=Game version to create (leave empty for <@s>{default}</>):
gdb_version_q_no_default=Game version to create (e.g. <@s>16.0.0</>):
gdb_already_present=<@su>Game data <@s>{version}</> is already present</>
