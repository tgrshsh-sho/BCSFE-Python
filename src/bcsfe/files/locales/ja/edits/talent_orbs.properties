# 入力例の属性・等級・効果の番号は日本版 16.0.0 のゲームデータに合わせている (効果の番号は上に表示される一覧が正)
edit_orbs_help=
>ヘルプ:
>指定できる等級: {all_grades_str}
>指定できる属性: {all_attributes_str}
>指定できる効果: {all_effects_str}
><@w>注意: すべての属性で、すべての等級・効果を指定できるわけではありません。</>
>入力例 (効果の番号は上の一覧で確認してください):
>    <c>悪</> - <c>悪魔</>の本能玉をすべて選択
>    <r>赤</> <b>s</> - <r>赤い敵</>用で等級が <b>S</> の本能玉をすべて選択
>    <b>エ</> <r>d</> <r>4</> - <b>エイリアン</>用で等級が <r>D</> の<r>ダメージアップ</>の本能玉を選択
>    <o>c</> <dm>7</> - 等級が <o>C</> のレジェンドストーリー強化の本能玉を選択
><@q>すべて</>の本能玉を選択するには、次のように入力します:
>    <@q>*</>
><@q>複数の条件</>で選択するには、<@q>半角カンマ</>で区切って次のように入力します:
>    <b>s</> <bl>黒</> <g>4</>,<r>d</> <o>3</>,<g>浮</>
