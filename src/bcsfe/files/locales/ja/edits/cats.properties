>レベルを入力してください。例:
><@t>10<@s>+</>20</> = レベル 10、+レベル 20
><@t>10<@s>+</></> = レベル 10、+レベルは現在のまま
><@t><@s>+</>20</> = レベルは現在のまま、+レベル 20
><@t>10</> = レベル 10、+レベル 0
><@t>5<@q>-</>10<@s>+</>20<@q>-</>30</> = レベルは 5〜10、+レベルは 20〜30 の範囲でランダム
><@t>5<@q>-</>10<@s>+</></> = レベルは 5〜10 の範囲でランダム、+レベルは現在のまま
><@t><@s>+</>20<@q>-</>30</> = レベルは現在のまま、+レベルは 20〜30 の範囲でランダム
><@t>{{max}}<@s>+</>{{max}}</> = レベル・+レベルともに最大
><@t>{{quit_key}}</> = 中止
>入力:

max_upgrade=最大レベル: <@t>{max_base}<@s>+</>{max_plus}</>

