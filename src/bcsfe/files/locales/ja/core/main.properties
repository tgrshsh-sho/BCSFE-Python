# Full documentation: https://codeberg.org/fieryhenry/ExampleEditorLocale#format-of-the-properties-files
# color formatting
#
# <@p> = primary color
# <@s> = secondary color
# <@t> = tertiary color
# <@q> = quaternary color
# <@e> = error color
# <@w> = warning color
# <@su> = success color
#
# </> = close current color
# When coloring, use the above formatting tags, not the actual color codes / names so that different colors can be used for different themes.
# You should only use the actual color codes / names if the exact colors are important, such coloring a target red talent orb as red.
# If you want to write < or > or / in the text, escape them with a backslash (\) e.g. \< or \> or \/
#
# <#rrggbb> = hex color
#
# <w> = white
# <bl> = black
# <r> = red
# <g> = green
# <b> = blue
# <y> = yellow
# <m> = magenta
# <c> = cyan
# <dy> = dark yellow
# <dg> = dark grey
# <db> = dark blue
# <dc> = dark cyan
# <dm> = dark magenta
# <dr> = dark red
# <dgn> = dark green
# <lg> = light grey
# <o> = orange
#
# 日本語ロケールのメモ:
# - yes_key / quit_key / all / max / infinity はユーザーが入力する値と比較されるため、半角英字のまま
# - 機能名は「日本語名|English」の形にすると、メニューには日本語名が表示され、英語名でも検索できる
#   ただし機能一覧以外の場所でもそのまま表示されるキーには | を使わない (| がそのまま表示されるため)

