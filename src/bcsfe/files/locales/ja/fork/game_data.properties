# jp fork: 公式アプリからのゲームデータ作成 (core/server/game_data_builder.py)
gdb_build_offer=
><@w>このバージョン (<@s>{version}</>) のゲームデータがまだありません。</>公式アプリから作成できます (約 180MB を取得)。
>作成しますか? ({{y/n}}):

# (上の空行は必須: 複数行の値の直後の行のキーはパーサーが読み飛ばす)
gdb_build_declined=<@w>作成を見送りました。新しいキャラやアイテムは番号だけで表示されることがあります。</>
gdb_build_start=<@q>公式アプリからゲームデータ <@s>{version}</> を作成します...</>
gdb_build_done=<@su>ゲームデータ <@s>{version}</> を作成しました: <@t>{path}</></>
gdb_build_failed=<@e>ゲームデータを作成できませんでした: {reason}</>

gdb_status_index=<@q>アプリのバージョン一覧を取得しています...</>
gdb_status_package_file=<@q>パッケージファイル <@s>{path}</> を使います</>
gdb_status_download_start=<@q>アプリのパッケージ <@s>{version}</> を取得しています (<@s>{size}</> MB)...</>
gdb_status_download=  <@s>{done}</> / <@s>{total}</> MB
gdb_status_extract=<@q>ゲームファイルを復号しています...</>
gdb_status_extracted=  <@t>{pack}</>: <@s>{files}</> 個

gdb_reason_network=ダウンロード先に接続できません ({error})
gdb_reason_http=ダウンロード先がエラーを返しました (HTTP {status})
gdb_reason_index=アプリのバージョン一覧を読み取れません
gdb_reason_version_unavailable=バージョン {version} は配布されていません (最新: {newest})
gdb_reason_sha256=取得したパッケージが壊れています (sha256 {got}、正しくは {expected})
gdb_reason_package=アプリのパッケージとして読み取れません ({error})
gdb_reason_wrong_package=にゃんこ大戦争 (jp) のパッケージではありません ({found})
gdb_reason_version_mismatch=パッケージのバージョンが {found} です ({version} ではありません)
gdb_reason_packs_missing=パッケージに {packs} が入っていません
gdb_reason_bad_list={pack}.list の中身が不正です ({error})
gdb_reason_bad_entry={pack}.pack のファイルを復号できません ({name})
gdb_reason_bad_name={pack}.list に不審なファイル名があるため中止しました ({name})
gdb_reason_write={path} に書き込めません ({error})
gdb_reason_exists={version} のゲームデータは既にあります
gdb_reason_unsupported=アプリからの作成は jp のみ対応しています (地域: {cc})
gdb_reason_bad_version=ゲームバージョンが不正です: {version}
gdb_reason_missing_file=パッケージファイル {path} がありません
gdb_reason_unexpected=予期しないエラー ({error})

gdb_build_from_app=公式アプリからゲームデータを作成
gdb_available_versions=作成できるバージョン (新しい順): <@t>{versions}</>
gdb_version_q=作成するバージョン (空欄なら <@s>{default}</>):
gdb_version_q_no_default=作成するバージョン (例: <@s>16.0.0</>):
gdb_already_present=<@su>ゲームデータ <@s>{version}</> は既にあります</>
