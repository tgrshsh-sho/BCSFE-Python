# 対話式の入力画面 (bcsfe.cli.tui) と設定項目 ui_mode

tui_hint_select=↑↓ 移動  Enter 決定  Esc 戻る  文字入力で絞り込み
tui_hint_multi=Tab 選択/解除  Ctrl-A 表示中をすべて選択  Ctrl-D 選択解除
tui_hint_confirm=y はい  n いいえ  ←→ 切替  Enter 決定  Esc 戻る
tui_hint_input=Enter 決定  Esc 戻る
tui_hint_keep=空欄のまま Enter で {value}
tui_hint_max=max で最大値 ({value})

tui_counter={shown} / {total}
tui_selected_count={count} 件選択中
tui_no_match=該当なし

tui_yes=はい
tui_no=いいえ

tui_range=範囲 {min}〜{max}
tui_current_label=現在値
tui_default_label=既定値

tui_error_not_number=整数で入力してください
tui_error_range={min}〜{max} の範囲で入力してください
tui_error_empty=値を入力してください

tui_cancelled=(キャンセル)
tui_empty_value=(空欄)
tui_summary_many={count} 件: {items} ほか

tui_fallback_notice=<@w>対話式の入力画面を開始できなかったため、従来の入力方式で続けます。</>

tui_ui_mode_auto=自動 (ターミナルでは対話式の入力画面)
tui_ui_mode_classic=従来 (常に番号を入力する方式)
tui_ui_mode_dialog=入力画面の方式を選んでください:

ui_mode=入力画面の方式
ui_mode_desc=ターミナルで実行しているときに、絞り込みできる一覧・チェックボックス・y/n の 1 キー回答を使う対話式の入力画面にするかどうか。<@q>auto</> はターミナルなら対話式、<@q>classic</> は常に番号を入力する従来の方式です。環境変数 <@q>BCSFE_UI=classic</> でも従来の方式になります {{config_value_txt}}
